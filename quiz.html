    <style>
        /* Aurora gradient background */
        .aurora-bg {
            background: linear-gradient(-45deg, #0a0e1a, #1a0033, #002244, #001a33);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }

        /* Aurora light effect overlay */
        .aurora-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            background:
                radial-gradient(ellipse at top left, rgba(0, 255, 170, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at top right, rgba(0, 170, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at bottom left, rgba(170, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at bottom right, rgba(255, 0, 170, 0.1) 0%, transparent 40%);
            pointer-events: none;
            opacity: 0.7;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #00ffaa, #00aaff);
            border-radius: 5px;
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #00ffaa 0%, #00aaff 50%, #aa00ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Card hover effect */
        .card-hover {
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .card-hover:hover {
            border-color: #00ffaa;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 170, 0.2);
        }

        /* Progress bar animation */
        @keyframes progressAnimation {
            0% { width: 0%; }
        }

        .progress-bar {
            animation: progressAnimation 2s ease-out forwards;
        }

        }

        .cloud-shape::after, .cloud-shape::before {
            content: '';
            position: absolute;
            background: var(--cloud-color);
            z-index: -1;
        }

        .cloud-shape::after {
            width: 45%; height: 180px;
            top: -70px; left: 80px;
            border-radius: 50%;
        }

        .cloud-shape::before {
            width: 50%; height: 220px;
            top: -100px; right: 80px;
            border-radius: 50%;
        }

<script>
    const questions = [
        { q: "¿Quién es responsable de la seguridad del sistema operativo y las aplicaciones en un modelo IaaS?", options: ["El proveedor de la nube", "El cliente", "El proveedor de Internet", "Nadie"], correct: 2 },
        { q: "Un desarrollador desea desplegar una app sin preocuparse por el SO o hardware. ¿Qué elige?", options: ["IaaS", "PaaS", "On-Premise", "SaaS"], correct: 1 },
        { q: "¿Qué modelo ofrece aplicaciones listas para usar en el navegador?", options: ["SaaS", "IaaS", "PaaS", "BaaS"], correct: 0 },
        { q: "¿Quién es responsable de la seguridad de los datos en SaaS?", options: ["El proveedor", "El usuario cliente", "La entidad reguladora", "El fabricante"], correct: 1 },
        { q: "¿Qué componente NO gestiona el usuario en PaaS?", options: ["Código", "Datos", "Sistema Operativo", "Configuraciones"], correct: 2 },
        { q: "¿Cuál es un ejemplo típico de IaaS?", options: ["Microsoft 365", "Amazon EC2", "Google App Engine", "Dropbox"], correct: 1 },
        { q: "Google Docs y Microsoft 365 son ejemplos perfectos de:", options: ["IaaS", "SaaS", "PaaS", "On-Premise"], correct: 2 },
        { q: "¿Qué modelo es más rentable para software estándar como CRM?", options: ["SaaS", "IaaS", "PaaS", "Hardware-as-a-Service"], correct: 0 },
        { q: "Migrar servidores físicos a máquinas virtuales es:", options: ["PaaS", "IaaS", "SaaS", "Nube Privada"], correct: 1 },
        { q: "¿Principal ventaja de PaaS sobre IaaS para desarrolladores?", options: ["Mayor control de SO", "Menos gestión de infraestructura", "Elegir hardware físico", "Uso de bases de datos"], correct: 1 }
    ];

    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').textContent = `Pregunta ${currentIdx + 1} de ${questions.length}`;
        document.getElementById('question').textContent = q.q;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => handleAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function handleAnswer(selected) {
        userAnswers.push({
            question: questions[currentIdx].q,
            selected: questions[currentIdx].options[selected],
            correct: questions[currentIdx].options[questions[currentIdx].correct],
            isCorrect: selected === questions[currentIdx].correct
        });

        if (selected === questions[currentIdx].correct) score++;

        currentIdx++;
        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('results-view').classList.remove('hidden');
        document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
        
        const details = document.getElementById('details');
        userAnswers.forEach((ans, i) => {
            const div = document.createElement('div');
            div.className = `result-item ${ans.isCorrect ? 'correct-item' : 'wrong-item'}`;
            div.innerHTML = `
                <strong>${i+1}. ${ans.question}</strong><br>
                Tu respuesta: ${ans.selected} ${ans.isCorrect ? '✅' : '❌'}<br>
                ${ans.isCorrect ? '' : `<em>Correcta: ${ans.correct}</em>`}
            `;
            details.appendChild(div);
        });
    }

    showQuestion();
</script>

    <script>
        // Mobile menu toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.add('hidden');
            });
        });

        // Add animation on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-slide-up');
                }
            });
        }, observerOptions);

        // Observe sections for animation
        document.querySelectorAll('section').forEach(section => {
            observer.observe(section);
        });

        // Smooth scroll for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
